<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="tarabezaBg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="tarabezaGold" x1="20" y1="20" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Architectural Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#tarabezaBg)" />
  <rect x="10" y="10" width="100" height="100" rx="24" stroke="#FFFDF9" stroke-opacity="0.16" stroke-width="2" />

  <!-- Open Book / Wisdom Wings above the Desk -->
  <path
    d="M60 49C50 42 37 40 26 42V26C37 24 50 26 60 33C70 26 83 24 94 26V42C83 40 70 42 60 49Z"
    fill="#FFFDF9"
  />
  <!-- Book Center Spine Spark -->
  <circle cx="60" cy="24" r="4.5" fill="url(#tarabezaGold)" />

  <!-- The "Tarabeza" (Study Desk Tabletop & Legs forming an architectural 'T') -->
  <!-- Tabletop -->
  <rect x="20" y="55" width="80" height="10" rx="5" fill="url(#tarabezaGold)" />
  <!-- Left & Right Angled Desk Legs -->
  <path
    d="M36 65L29 94"
    stroke="#FFFDF9"
    stroke-width="8"
    stroke-linecap="round"
  />
  <path
    d="M84 65L91 94"
    stroke="#FFFDF9"
    stroke-width="8"
    stroke-linecap="round"
  />
  <!-- Center Support Crossbar -->
  <rect x="43" y="76" width="34" height="6" rx="3" fill="#FFFDF9" fill-opacity="0.85" />
</svg>
